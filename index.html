<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07090d">
<title>断空</title>
<style>
  :root { color-scheme: dark; --amber:#ff8a1e; --bone:#e7e1d6; --dim:#9aa3ad; --line:#2a313a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #07090d; color: var(--bone); font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; overflow: hidden; touch-action: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #speed { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%); opacity: 0; }
  #vignette { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 80px 20px rgba(180,30,20,.0); }
  .screen { position: fixed; inset: 0; display: none; padding: calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left)); }
  .screen.on { display: flex; }
  #home, #result { flex-direction: column; justify-content: flex-end; gap: 10px; background: linear-gradient(transparent, rgba(7,9,13,.72) 40%, rgba(7,9,13,.88)); pointer-events: none; }
  #home .panel, #result .panel, #garage { pointer-events: auto; }
  h1 { font-size: 40px; letter-spacing: .18em; margin: 0; font-weight: 600; }
  .sub { color: var(--dim); letter-spacing: .22em; font-size: 12px; margin: 2px 0 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .tap { font: inherit; color: var(--bone); background: rgba(16,20,26,.82); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 0 14px; }
  button.primary { background: var(--amber); color: #1a1006; border-color: transparent; font-weight: 700; }
  button:active { transform: translateY(1px); }
  #garage { display: none; flex-direction: column; background: rgba(7,9,13,.78); gap: 8px; }
  #garage.on { display: flex; }
  #parts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; overflow: auto; }
  .part { text-align: left; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-height: 48px; }
  .part b { font-weight: 600; }
  .part span { color: var(--dim); font-size: 11px; }
  #stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { background: #12171e; border-radius: 8px; padding: 6px 8px; }
  .stat i { display: block; height: 4px; margin-top: 4px; background: #243; border-radius: 2px; }
  .stat i b { display: block; height: 100%; background: var(--amber); width: 0; }
  .stat em { font-style: normal; color: var(--dim); font-size: 10px; letter-spacing: .08em; }
  #weight { font-variant-numeric: tabular-nums; }
  #weight.bad { color: #ff5d4a; }
  #hud { position: fixed; inset: 0; display: none; pointer-events: none; padding: calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left)); }
  #hud.on { display: block; }
  .bar { height: 8px; background: #1b2129; border-radius: 4px; overflow: hidden; width: min(42vw, 280px); }
  .bar b { display: block; height: 100%; width: 0; }
  #apb b { background: #e7e1d6; }
  #enb b { background: #3ec6ff; }
  #enb.red b { background: #ff4d3a; }
  #stb b { background: #ffb020; }
  #meters { position: absolute; top: calc(46px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 4px; }
  #speedn { font-size: 28px; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  #speedn small { font-size: 12px; color: var(--dim); letter-spacing: .14em; }
  #reticle { position: absolute; left: 50%; top: 46%; width: 86px; height: 86px; transform: translate(-50%,-50%); border: 1px solid rgba(231,225,214,.35); }
  #reticle.lock { border-color: #3ec6ff; box-shadow: 0 0 0 1px rgba(62,198,255,.25); }
  #weapon { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); text-align: right; }
  #touch { position: fixed; inset: 0; display: none; }
  #touch.on { display: block; }
  #stick { position: absolute; left: calc(16px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 118px; height: 118px; border-radius: 50%; border: 1px solid rgba(231,225,214,.25); background: rgba(8,10,14,.28); }
  #knob { position: absolute; left: 39px; top: 39px; width: 40px; height: 40px; border-radius: 50%; background: rgba(231,225,214,.85); }
  #btns { position: absolute; right: calc(10px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, 52px); gap: 6px; }
  #btns button { min-height: 46px; padding: 0; font-size: 11px; letter-spacing: .04em; }
  #btns button.big { background: rgba(255,138,30,.9); color: #1a1006; font-weight: 700; }
  #retreat { position: absolute; left: calc(12px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top)); pointer-events: auto; min-height: 36px; font-size: 12px; }
  #hint { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); color: var(--dim); font-size: 12px; letter-spacing: .08em; pointer-events: none; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #07090d; z-index: 9; text-align: center; padding: 24px; letter-spacing: .12em; }
  @media (orientation: portrait) {
    #rotate { display: flex; }
  }
  #log { position: absolute; bottom: 8px; left: 8px; color: #445; font-size: 10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="speed"></div>
<div id="vignette"></div>
<div id="rotate">横向きにしてください<br><span style="display:block;margin-top:8px;color:#9aa3ad;letter-spacing:.08em;font-size:14px">iPhone SE は横画面で操縦します</span></div>
<section id="home" class="screen on">
  <div class="panel">
    <div class="sub">HIGH SPEED MECH ACTION</div>
    <h1>断空</h1>
    <p class="sub" id="buildname">速度が装甲だ</p>
    <div class="row">
      <button class="primary" id="go-duel">模擬戦</button>
      <button id="go-sweep">掃討</button>
      <button id="go-drill">航路</button>
      <button id="go-garage">整備</button>
    </div>
  </div>
</section>
<section id="garage" class="screen">
  <div class="row" style="justify-content:space-between;align-items:center">
    <strong>整備</strong>
    <span id="weight"></span>
  </div>
  <div id="parts"></div>
  <div id="stats"></div>
  <div class="row">
    <button id="pre-light">軽翼</button>
    <button id="pre-mid">中核</button>
    <button id="pre-heavy">重砲</button>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#9aa3ad">旋回<input id="tuning" type="range" min="-100" max="100" value="-40">安定</label>
  </div>
  <div class="row">
    <button id="enemy-light">相手 軽翼</button>
    <button id="enemy-mid">相手 中核</button>
    <button id="enemy-heavy">相手 重砲</button>
  </div>
  <div class="row">
    <button id="back-home">戻る</button>
    <button class="primary" id="sortie">この機体で出撃</button>
  </div>
</section>
<section id="result" class="screen">
  <div class="panel">
    <h1 id="result-title">結果</h1>
    <p id="result-body" class="sub"></p>
    <div class="row">
      <button class="primary" id="again">再出撃</button>
      <button id="to-garage">整備</button>
      <button id="to-home">戻る</button>
    </div>
  </div>
</section>
<div id="hud">
  <div id="meters">
    <div id="speedn">0<small> km/h</small></div>
    <div class="bar" id="apb"><b></b></div>
    <div class="bar" id="enb"><b></b></div>
    <div class="bar" id="stb"><b></b></div>
    <div id="state" class="sub"></div>
  </div>
  <div id="weapon"></div>
  <div id="reticle"></div>
  <button id="retreat">撤退</button>
</div>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <button data-act="lock">ロック</button>
    <button data-act="swap">切替</button>
    <button data-act="jump">上昇</button>
    <button data-act="back">背中</button>
    <button data-act="qb">QB</button>
    <button data-act="melee">格闘</button>
    <button data-act="boost" class="big">ブースト</button>
    <button data-act="ab" class="big">強襲</button>
    <button data-act="fire" class="big" style="grid-column: span 4">射撃</button>
  </div>
</div>
<script>
window.addEventListener('error', function (e) {
  var d = document.createElement('pre');
  d.id = 'booterr';
  d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:30;background:#3a1010;color:#fff;padding:8px;white-space:pre-wrap;font-size:12px';
  d.textContent = (e.message || 'error') + '\n' + (e.filename || '') + ':' + (e.lineno || '');
  document.body.appendChild(d);
});
</script>
<script src="sim.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module" src="game.js"></script>
</body>
</html>
